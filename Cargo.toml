[package]
name = "ripple"
version = "0.1.1"
edition = "2024"
description = "A Dynamic Island for All"
license = "MIT"

[dependencies]
# Rune is pre-release: pin one `dev` rev here and in every [patch] below.
rune = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Weather, the AI assistant's stream and T3's HTTP API; T3's /ws RPC.
ureq = "3"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# T3's MCP sign-in (PKCE) and the token cache key.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# The tray icon's pixels.
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# The status-bar item and the Island's unconstrained frame (src/mac.rs).
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# The Island's input shape: clicks outside it reach the windows underneath.
x11rb = { version = "0.13", features = ["shape"] }
# Whether the compositor has layer-shell, which the Island needs to run natively on Wayland.
wayland-client = "0.31"

# Cargo doesn't inherit a dependency's patches; these mirror Rune's own [patch.crates-io].
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }

# Rune's debug info alone can take many GB of RAM to link; line tables keep panics readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[package]
name = "ripple"
version = "0.9.1"
edition = "2024"
description = "A Dynamic Island for All"
license = "MIT"

[dependencies]
# Rune is pre-release: pin one `dev` rev here and in every [patch] below.
# native-file-dialog: Settings export and import.
rune = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Every HTTP call (see net::config); T3's /ws RPC.
ureq = "3"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Hashes and encodings: T3's sign-in (PKCE), Nextcloud's auth, cache keys.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# The tray icon's pixels.
png = "0.18"
# The System tab's CPU, memory, disk and network figures.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
# Lua plugins on the Plugins tab (src/plugins.rs).
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
# Shelf: compressing to and extracting from .zip.
zip = { version = "9.8.0", default-features = false, features = ["deflate-flate2"] }
# Notes' live Markdown preview (already built for rune-kit's Markdown).
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
# Discord: the user's id, so the token goes only to a Discord socket they own (src/discord.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Discord: the pipe server's session, so the token goes only to a Discord in the user's own (src/discord.rs).
# Games: the shell hook that hears a game window flash, and its exe (src/games.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The status-bar item and the Island's unconstrained frame (src/mac.rs).
objc2 = "0.6"
# The handler that hears of other apps' downloads (NSProgress, src/mac.rs).
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# The Island's input shape (clicks outside it reach the windows underneath) and desktop drag starts.
x11rb = { version = "0.13", features = ["shape", "xfixes"] }
# Whether the compositor has layer-shell, which the Island needs to run natively on Wayland.
wayland-client = "0.31"
# The portal's screen colour sampler (src/pick.rs); already in the tree for AccessKit.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Cargo doesn't inherit a dependency's patches; these mirror Rune's own [patch.crates-io].
[patch.crates-io]
winit = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5" }
parley_engine = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5" }
wgpu-hal = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5" }
naga = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5" }
accesskit_windows = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5" }
accesskit_macos = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5" }
sctk-adwaita = { git = "https://github.com/theoneand33/rune", rev = "e23f8e71a3a4d834204312c3939c4b8c00f5b2f5" }

# Rune's debug info alone can take many GB of RAM to link; line tables keep panics readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[package]
name = "ripple"
version = "0.7.6"
edition = "2024"
description = "A Dynamic Island for All"
license = "MIT"

[dependencies]
# Rune is pre-release: pin one `dev` rev here and in every [patch] below.
# native-file-dialog: Settings export and import.
rune = { git = "https://github.com/theoneand33/rune", rev = "e0ff6d11f6733ab12f3b28edb7f64c952d1ef78c", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/theoneand33/rune", rev = "e0ff6d11f6733ab12f3b28edb7f64c952d1ef78c", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Every HTTP call (see net::config); T3's /ws RPC.
ureq = "3"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Hashes and encodings: T3's sign-in (PKCE), Nextcloud's auth, cache keys.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# The tray icon's pixels.
png = "0.18"
# The System tab's CPU, memory, disk and network figures.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
# Lua plugins on the Plugins tab (src/plugins.rs).
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# Shelf: compressing to and extracting from .zip.
zip = { version = "9.8.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The status-bar item and the Island's unconstrained frame (src/mac.rs).
objc2 = "0.6"
# The handler that hears of other apps' downloads (NSProgress, src/mac.rs).
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# The Island's input shape (clicks outside it reach the windows underneath) and desktop drag starts.
x11rb = { version = "0.13", features = ["shape", "xfixes"] }
# Whether the compositor has layer-shell, which the Island needs to run natively on Wayland.
wayland-client = "0.31"
# The portal's screen colour sampler (src/pick.rs); already in the tree for AccessKit.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Cargo doesn't inherit a dependency's patches; these mirror Rune's own [patch.crates-io].
[patch.crates-io]
winit = { git = "https://github.com/theoneand33/rune", rev = "e0ff6d11f6733ab12f3b28edb7f64c952d1ef78c" }
parley_engine = { git = "https://github.com/theoneand33/rune", rev = "e0ff6d11f6733ab12f3b28edb7f64c952d1ef78c" }
wgpu-hal = { git = "https://github.com/theoneand33/rune", rev = "e0ff6d11f6733ab12f3b28edb7f64c952d1ef78c" }
accesskit_windows = { git = "https://github.com/theoneand33/rune", rev = "e0ff6d11f6733ab12f3b28edb7f64c952d1ef78c" }
accesskit_macos = { git = "https://github.com/theoneand33/rune", rev = "e0ff6d11f6733ab12f3b28edb7f64c952d1ef78c" }
sctk-adwaita = { git = "https://github.com/theoneand33/rune", rev = "e0ff6d11f6733ab12f3b28edb7f64c952d1ef78c" }

# Rune's debug info alone can take many GB of RAM to link; line tables keep panics readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

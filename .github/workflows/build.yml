name: Multi-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: false

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One OS failing shouldn't hide whether the others pass.
      fail-fast: false
      matrix:
        include:
          - name: macOS (x64)
            os: macos-latest
            platform: macos
            target: x86_64-apple-darwin
            os-label: macOS-x64
          - name: macOS (arm64)
            os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            os-label: macOS-arm64
          - name: Windows
            os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            os-label: Windows
          - name: Linux
            os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            os-label: Linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # PR caches only serve re-runs of that PR; saving them costs 12-60s per job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Get version from Cargo.toml
        id: pkg
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev aria2 libxkbcommon-x11-0 mesa-vulkan-drivers xvfb x11-apps

      # macOS x64 shares the arm64 runner, so tests there would repeat the arm64 job.
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked

      - name: Probe this OS (media, battery, Bluetooth, camera, microphone)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked -- --ignored --nocapture probes

      - name: Render every view headlessly
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          mkdir -p out
          # One build, then the binary itself: `cargo run` re-checks freshness per scene (slow on Windows).
          cargo build --locked -q
          for scene in quick charging large search workflows assistant clipboard tasks system t3-device playing playing-progress overview-playing camera bluetooth-off notch win95 glass glass-large; do
            target/debug/ripple --window island --scene "$scene" --snap "out/smoke-scene-$scene.png"
          done
          target/debug/ripple --window settings --size 520x2600 --snap out/smoke-scene-settings.png

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          APP=out/Ripple.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/ripple "$APP/Contents/MacOS/Ripple"
          cp assets/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Ripple</string>
            <key>CFBundleIdentifier</key><string>com.topmyster.ripple</string>
            <key>CFBundleExecutable</key><string>Ripple</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSUIElement</key><true/>
            <key>NSAppleEventsUsageDescription</key><string>Ripple reads and controls what Spotify and Music are playing.</string>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$APP"
          hdiutil create -volname Ripple -srcfolder "$APP" -ov -format UDZO "out/Ripple-${{ matrix.os-label }}-v${VERSION}.dmg"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/ripple.exe -DestinationPath "out/Ripple-${{ matrix.os-label }}-v${{ steps.pkg.outputs.version }}.zip"

      - name: Package (Linux AppImage and tarball)
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          mkdir -p out
          tar -czf "out/Ripple-Linux-v${VERSION}.tar.gz" -C target/${{ matrix.target }}/release ripple
          aria2c -c -x 8 -s 8 -k 1M -d "$RUNNER_TEMP" -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPDIR="$RUNNER_TEMP/Ripple.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp target/${{ matrix.target }}/release/ripple "$APPDIR/usr/bin/ripple"
          cp assets/icons/icon.png "$APPDIR/ripple.png"
          cp assets/ripple.desktop "$APPDIR/ripple.desktop"
          ln -s usr/bin/ripple "$APPDIR/AppRun"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" "$APPDIR" "out/Ripple-Linux-v${VERSION}.AppImage"

      # Launch the real app for 15 seconds: it must still be running, and the screen is kept.
      - name: Smoke run (macOS)
        if: matrix.platform == 'macos' && matrix.target == 'aarch64-apple-darwin'
        run: |
          target/${{ matrix.target }}/release/ripple > out/smoke-${{ matrix.os-label }}.log 2>&1 &
          PID=$!
          sleep 15
          screencapture -x out/smoke-${{ matrix.os-label }}.png || true
          cat out/smoke-${{ matrix.os-label }}.log
          kill -0 $PID
          kill $PID

      - name: Smoke run (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process target/${{ matrix.target }}/release/ripple.exe -PassThru -RedirectStandardError out/smoke-Windows.log
          Start-Sleep 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("out/smoke-Windows.png")
          Get-Content out/smoke-Windows.log -ErrorAction SilentlyContinue
          if ($p.HasExited) { throw "Ripple exited with code $($p.ExitCode)" }
          Stop-Process $p

      - name: Smoke run (Linux)
        if: matrix.platform == 'linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            target/${{ matrix.target }}/release/ripple > out/smoke-Linux.log 2>&1 &
            PID=$!
            sleep 15
            xwd -root -silent > out/smoke-Linux.xwd || true
            cat out/smoke-Linux.log
            kill -0 $PID && kill $PID'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ripple-${{ matrix.os-label }}-v${{ steps.pkg.outputs.version }}
          path: |
            out/*.dmg
            out/*.zip
            out/*.tar.gz
            out/*.AppImage
          if-no-files-found: error

      # Kept apart from the installers, so a release never attaches them.
      - name: Upload smoke run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os-label }}
          path: out/smoke-*
          if-no-files-found: ignore
